name: Release Binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tesseract-*
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -maxdepth 1 -type f | sort
          [[ "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 5 ]]
          [[ "$(find dist -maxdepth 1 -name '*.tar.gz.sha256' | wc -l)" -eq 5 ]]
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
            --notes 'Unofficial portable Tesseract command-line binaries.' dist/*