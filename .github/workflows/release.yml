name: Release Binaries

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tesseract-*
          path: dist
          merge-multiple: true
      - name: Check assets
        run: |
          find dist -maxdepth 1 -type f | sort
          [[ "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 5 ]]
          [[ "$(find dist -maxdepth 1 -name '*.tar.gz.sha256' | wc -l)" -eq 5 ]]
          (cd dist && cat *.tar.gz.sha256 | sha256sum --check --strict)
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes 'Unofficial portable Tesseract command-line binaries.' dist/*
