name: Build

# Only changes that can affect the binaries start a build. Keep this list in step with the
# inputs of scripts/build.sh.
on:
  push:
    branches: [master]
    paths: &build-inputs
      - .github/workflows/build.yml
      - build-images.json
      - overlay-ports/**
      - triplets/**
      - vcpkg.json
      - vcpkg-configuration.json
      - scripts/build.sh
      - scripts/fetch-testdata.sh
      - scripts/package.sh
      - scripts/verify.sh
      - test/**
  pull_request:
    paths: *build-inputs
  workflow_call:
    inputs:
      release_tag:
        description: Release tag in v<version>_<build> format.
        required: false
        type: string

# A newer push to the same branch or PR cancels the older build. Release builds (tags) never
# are.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # The container images are pinned in build-images.json, not here: refresh.yml moves their
  # digests, and a workflow's token may not change workflow files.
  images:
    name: Read build images
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.read.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: build-images.json
          sparse-checkout-cone-mode: false
      - name: Read the digest-pinned images
        id: read
        shell: bash
        run: |
          set -euo pipefail
          jq -e 'all(.[]; test("^[a-z0-9./_-]+(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}$"))' build-images.json > /dev/null
          echo "images=$(jq -c . build-images.json)" >> "$GITHUB_OUTPUT"

  build-linux:
    name: ${{ matrix.target }}
    needs: images
    runs-on: ${{ matrix.runner }}
    container: ${{ fromJSON(needs.images.outputs.images)[matrix.target] }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            triplet: x64-linux-portable
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            triplet: arm64-linux-portable
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install build tools
        run: dnf --disablerepo=extras install -y autoconf automake cmake curl git jq libtool make nasm ninja-build patch perl pkgconfig tar which
      - name: Build and verify
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET: ${{ matrix.triplet }}
        run: scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tesseract-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  build-native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            triplet: x64-osx-portable
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            triplet: arm64-osx-portable
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            triplet: x64-windows-static
            runner: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install macOS build tools
        if: contains(matrix.target, 'apple')
        run: brew install pkg-config
      - name: Set up MSVC environment
        if: contains(matrix.target, 'windows')
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Build and verify
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET: ${{ matrix.triplet }}
        run: scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tesseract-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  clean-linux:
    name: Clean environment (${{ matrix.target }})
    needs: [images, build-linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tesseract-${{ matrix.target }}
          path: package
      - name: Run in Debian Bookworm
        shell: bash
        env:
          IMAGE: ${{ fromJSON(needs.images.outputs.images)['clean-environment'] }}
        run: |
          mkdir extracted
          tar -C extracted -xzf package/*.tar.gz
          docker run --rm --volume "$PWD/extracted:/opt/tesseract:ro" "$IMAGE" \
            /opt/tesseract/bin/tesseract --version

  compare-buildinfo:
    name: Compare packages with the latest release
    # The PR you open from the branch refresh.yml pushes (not a fork's branch of that name).
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'automation/vcpkg-refresh' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [build-linux, build-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tesseract-*
          path: current
          merge-multiple: true
      - name: Write the package diff to the job summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(gh release list --limit 100 --json tagName,isDraft --jq '[.[] | select((.isDraft | not) and (.tagName | startswith("v")))] | .[0].tagName // empty')"
          if [[ -z "$latest_tag" ]]; then
            echo 'No published binary release to compare with.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir previous
          gh release download "$latest_tag" --pattern '*.tar.gz' --dir previous
          printf '## vcpkg packages compared with `%s`\n' "$latest_tag" >> "$GITHUB_STEP_SUMMARY"
          changed=false
          for archive in current/*.tar.gz; do
            target="$(tar -xOf "$archive" BUILDINFO.json | jq -r '.target')"
            previous_archive="$(find previous -name "*-${target}.tar.gz" -print -quit)"
            if [[ -z "$previous_archive" ]]; then
              printf '\n### %s\nNo matching previous artifact.\n' "$target" >> "$GITHUB_STEP_SUMMARY"
              changed=true
              continue
            fi
            current_packages="$(tar -xOf "$archive" BUILDINFO.json | jq -S '.packages')"
            previous_packages="$(tar -xOf "$previous_archive" BUILDINFO.json | jq -S '.packages')"
            if [[ "$current_packages" != "$previous_packages" ]]; then
              printf '\n### %s\n```diff\n' "$target" >> "$GITHUB_STEP_SUMMARY"
              diff -u <(printf '%s\n' "$previous_packages") <(printf '%s\n' "$current_packages") >> "$GITHUB_STEP_SUMMARY" || true
              printf '```\n' >> "$GITHUB_STEP_SUMMARY"
              changed=true
            fi
          done
          if [[ "$changed" == false ]]; then
            printf '\nNo package versions changed; close the refresh PR.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
