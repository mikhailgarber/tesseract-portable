name: Refresh vcpkg

on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions: {}

# Workflows may not create or approve pull requests (repository setting). The refresh pushes a
# branch and opens an issue with a link to open the PR; that PR's Build run compares the
# packages with the latest release.
jobs:
  refresh:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    env:
      BRANCH: automation/vcpkg-refresh
    steps:
      # Credentials stay in the checkout to push the branch. Only this repository's own scripts
      # run here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update baseline, overlay and container images
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(git ls-remote https://github.com/microsoft/vcpkg.git refs/heads/master | awk '{print $1}')"
          current="$(jq -r '."default-registry".baseline' vcpkg-configuration.json)"
          if [[ "$baseline" != "$current" ]]; then
            scripts/refresh-overlay.sh "$baseline"
          fi
          scripts/refresh-images.sh
      - name: Push the refresh branch and open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo 'Nothing to refresh.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add --all
          git commit --quiet --message 'chore: refresh vcpkg baseline and build images'
          git push --force origin "$BRANCH"

          title='vcpkg refresh ready for review'
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title |
            jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')"
          existing="$number"
          if [[ -z "$number" ]]; then
            number="$(gh issue create --title "$title" --body 'Preparing…' | sed -E 's#.*/##')"
          fi
          pr_title='chore: refresh vcpkg baseline and build images'
          pr_url="https://github.com/$GH_REPO/compare/master...$BRANCH?expand=1&title=$(jq -rn --arg v "$pr_title" '$v|@uri')&body=$(jq -rn --arg v "Closes #$number" '$v|@uri')"
          {
            echo "The scheduled refresh pushed \`$BRANCH\` ($(git rev-parse --short HEAD), $(date -u +%Y-%m-%d))."
            echo
            echo '```'
            git show --stat --format= HEAD
            echo '```'
            echo
            echo "**[Open the pull request]($pr_url)**. Its Build run lists the package version changes against the latest release in the \"Compare packages with the latest release\" job summary. If nothing changed, close the PR and this issue; otherwise merge it and tag the next \`v<version>_<build>\` release."
          } > body.md
          gh issue edit "$number" --body-file body.md
          if [[ -n "$existing" ]]; then
            gh issue comment "$number" --body "Refreshed again: \`$BRANCH\` is now $(git rev-parse --short HEAD); the description is updated."
          fi
          echo "Issue #$number" >> "$GITHUB_STEP_SUMMARY"
