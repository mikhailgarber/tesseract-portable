name: Refresh vcpkg

on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Credentials stay in the checkout: create-pull-request pushes the branch. Only this
      # repository's own scripts run here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Update baseline, overlay and container images
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(git ls-remote https://github.com/microsoft/vcpkg.git refs/heads/master | awk '{print $1}')"
          current="$(jq -r '."default-registry".baseline' vcpkg-configuration.json)"
          if [[ "$baseline" != "$current" ]]; then
            scripts/refresh-overlay.sh "$baseline"
          fi
          scripts/refresh-images.sh
      - id: pr
        name: Open refresh pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: automation/vcpkg-refresh
          delete-branch: true
          commit-message: 'chore: refresh vcpkg baseline and build images'
          title: 'chore: refresh vcpkg baseline and build images'
          body: |
            Updates the vcpkg baseline, recreates the Tesseract overlay from that exact commit, and moves the pinned build container digests.

            This workflow dispatches the Build workflow on this branch (PRs opened with `GITHUB_TOKEN` trigger no `pull_request` workflows). Its "Compare packages with the latest release" job summary lists the package version changes. If nothing changed, close this PR; otherwise merge it and tag the next `v<version>_<build>` release.
      - name: Build the refresh branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build.yml --ref automation/vcpkg-refresh
